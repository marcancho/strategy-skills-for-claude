<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{font-variant-numeric:lining-nums;background:radial-gradient(120% 80% at 85% 10%, #f3e9d2 0%, #faf7f0 60%);color:#2b2b2b;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.deco{position:absolute;right:-260px;top:-260px;opacity:1}
.deco2{position:absolute;left:-200px;bottom:-200px}
.frame{position:absolute;inset:0;padding:76px 84px 76px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:14px;font-family:'Playfair Display',serif;font-weight:700;font-size:38px;letter-spacing:.3px}
.logo b{color:#b8860b}
.tag{font-size:19px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#b8860b;border:2px solid #b8860b;padding:10px 18px;border-radius:999px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px}
.eyebrow{font-size:22px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#5e574b;display:flex;align-items:center;gap:16px}
.eyebrow:before{content:'';width:56px;height:3px;background:#b8860b}
h1{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-weight:700;font-size:58px;line-height:1.12;letter-spacing:-.5px;max-width:860px}
h1 em{font-style:italic;color:#b8860b;font-weight:600}
.sub{font-size:30px;line-height:1.4;color:#5e574b;max-width:820px}
.stat{border-left:6px solid #b8860b;padding-left:28px}
.num{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-weight:700;font-size:110px;line-height:1;color:#b8860b}
.cap{font-size:28px;line-height:1.35;color:#2b2b2b;margin-top:14px;max-width:760px;font-weight:500}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.btn{background:#b8860b;color:#ffffff;font-weight:700;font-size:30px;padding:22px 40px;border-radius:999px;display:inline-flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.src{font-size:17px;color:#5e574b;text-align:right;max-width:340px;line-height:1.35}
</style></head><body>
<svg class="deco" width="820" height="820" viewBox="-560 -560 1120 1120"><circle cx="0" cy="0" r="60" fill="none" stroke="rgba(184,134,11,0.50)" stroke-width="1.5"/><circle cx="0" cy="0" r="120" fill="none" stroke="rgba(184,134,11,0.45)" stroke-width="1.5"/><circle cx="0" cy="0" r="180" fill="none" stroke="rgba(184,134,11,0.40)" stroke-width="3"/><circle cx="0" cy="0" r="240" fill="none" stroke="rgba(184,134,11,0.35)" stroke-width="1.5"/><circle cx="0" cy="0" r="300" fill="none" stroke="rgba(184,134,11,0.30)" stroke-width="1.5"/><circle cx="0" cy="0" r="360" fill="none" stroke="rgba(184,134,11,0.25)" stroke-width="3"/><circle cx="0" cy="0" r="420" fill="none" stroke="rgba(184,134,11,0.20)" stroke-width="1.5"/><circle cx="0" cy="0" r="480" fill="none" stroke="rgba(184,134,11,0.15)" stroke-width="1.5"/><circle cx="0" cy="0" r="540" fill="none" stroke="rgba(184,134,11,0.10)" stroke-width="3"/><circle cx="0" cy="0" r="22" fill="#b8860b"/></svg>
<svg class="deco2" width="520" height="520" viewBox="-260 -260 520 520"><circle cx="0" cy="0" r="60" fill="none" stroke="rgba(184,134,11,0.50)" stroke-width="1.5"/><circle cx="0" cy="0" r="120" fill="none" stroke="rgba(184,134,11,0.45)" stroke-width="1.5"/><circle cx="0" cy="0" r="180" fill="none" stroke="rgba(184,134,11,0.40)" stroke-width="3"/><circle cx="0" cy="0" r="240" fill="none" stroke="rgba(184,134,11,0.35)" stroke-width="1.5"/></svg>
<div class="frame">
  <div class="top">
    <div class="logo"><svg width="46" height="46" viewBox="-25 -25 50 50"><circle r="22" fill="none" stroke="#b8860b" stroke-width="3"/><circle r="14" fill="none" stroke="#b8860b" stroke-width="2"/><circle r="6" fill="#b8860b"/></svg><span>Gold<b>Ageing</b></span></div>
    <div class="tag">Longevidade</div>
  </div>
  <div class="main">
    <div class="eyebrow">O país mudou</div>
    <div class="stat"><div class="num">1 em cada 4</div><div class="cap">portugueses tem 65 ou mais anos (23,4%).</div></div><h1>Portugal envelhece. Vamos tratá-lo como <em>oportunidade</em>.</h1>
  </div>
  <div class="bottom">
    <div class="btn">Siga e partilhe <span>→</span></div>
    <div class="src">Fonte: INE, Censos 2021</div>
  </div>
</div></body></html>
