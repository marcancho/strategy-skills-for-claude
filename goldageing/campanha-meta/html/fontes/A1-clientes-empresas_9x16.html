<!doctype html><html lang="pt-PT"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px}
body{font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#ffffff;background:linear-gradient(135deg, #b8860b, #8a6508);position:relative;overflow:hidden}
.band{position:absolute;left:0;top:0;width:100%;height:370px;background:transparent;border-bottom:1.5px solid rgba(255,255,255,.35);}
.head{position:absolute;left:72px;right:72px;top:250px;height:120px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.logo{font-size:50px;letter-spacing:-.5px;font-weight:500}.logo b{font-weight:900}
.tag{font-size:22px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.16);padding:10px 20px;border-radius:999px}
.content{position:absolute;left:72px;right:72px;top:414px;bottom:340px;display:flex;flex-direction:column;gap:30px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px;min-height:0}
.badge{align-self:flex-start;font-size:24px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:10px 20px;border-radius:999px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.6);color:#fff}
h1{font-weight:900;font-size:76px;line-height:1.08;letter-spacing:-1.5px}h1 em{font-style:normal;color:#f5e6c4}
.sub{font-size:36px;line-height:1.42;color:rgba(255,255,255,.94);font-weight:400}
.stat{background:#fff;border:1px solid #e6dcc6;border-left:10px solid #8a6508;border-radius:12px;padding:28px 38px;box-shadow:0 4px 20px rgba(0,0,0,.08);align-self:flex-start;max-width:100%}
.num{font-weight:900;color:#8a6508;font-size:118px;line-height:1;letter-spacing:-2px}
.cap{font-size:32px;line-height:1.35;color:#2b2b2b;margin-top:10px;font-weight:500;max-width:760px}
.card{background:#fff;border:1px solid #e6dcc6;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.1);flex:none}
.card svg{width:100%;height:100%;display:block}
.phototall{position:relative;height:540px;background:#f5e6c4}.photosq{position:relative;background:#f5e6c4;width:430px;flex:none}
.halo{position:absolute;inset:0;background:radial-gradient(60% 55% at 50% 38%, #fff 0%, rgba(255,255,255,0) 100%)}
.two{display:flex;gap:40px;height:100%}.two.rev{flex-direction:row-reverse}.col{flex:1;display:flex;flex-direction:column;min-width:0}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.cta{font-weight:700;font-size:38px;padding:28px 50px;border-radius:12px;background:#fff;color:#8a6508;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.src{font-size:22px;color:rgba(255,255,255,.88);text-align:right;max-width:340px;line-height:1.35}
</style></head><body><div style="position:absolute;right:-300px;bottom:300px;width:760px;height:760px;border-radius:50%;background:rgba(255,255,255,.07)"></div><div class="band"></div>
<div class="head"><div class="logo">Gold<b>Ageing</b></div><div class="tag">Certificação Senior-Friendly</div></div>
<div class="content"><div class="main"><div class="badge">Silver Economy</div><h1>O cliente <em>50+</em> não é um nicho. É o seu maior mercado.</h1><div class="stat"><div class="num">5,7 biliões €</div><div class="cap">valor estimado da Silver Economy na UE em 2025</div></div></div><div class="bottom"><div class="cta">Peça o diagnóstico →</div><div class="src">Fonte: Comissão Europeia (2018)</div></div></div></body></html>
