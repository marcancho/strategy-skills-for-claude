<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px}
body{font-variant-numeric:lining-nums;background:radial-gradient(circle, rgba(212,166,42,0.35) 2px, transparent 2.5px) 0 0/42px 42px, radial-gradient(120% 80% at 85% 10%, #2a2620 0%, #1c1a17 60%);color:#faf7f0;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.deco{position:absolute;right:-220px;top:120px;opacity:1}
.deco2{position:absolute;left:-200px;bottom:-200px}
.frame{position:absolute;inset:0;padding:280px 84px 360px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:14px;font-family:'Playfair Display',serif;font-weight:700;font-size:44px;letter-spacing:.3px}
.logo b{color:#d4a62a}
.tag{font-size:22px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#d4a62a;border:2px solid #d4a62a;padding:10px 18px;border-radius:999px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px}
.eyebrow{font-size:26px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#cfc6b2;display:flex;align-items:center;gap:16px}
.eyebrow:before{content:'';width:56px;height:3px;background:#d4a62a}
h1{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-weight:700;font-size:96px;line-height:1.12;letter-spacing:-.5px;max-width:900px}
h1 em{font-style:italic;color:#d4a62a;font-weight:600}
.sub{font-size:36px;line-height:1.4;color:#cfc6b2;max-width:820px}
.stat{border-left:6px solid #d4a62a;padding-left:28px}
.num{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-weight:700;font-size:220px;line-height:1;color:#d4a62a}
.cap{font-size:34px;line-height:1.35;color:#faf7f0;margin-top:14px;max-width:760px;font-weight:500}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.btn{background:#d4a62a;color:#1c1a17;font-weight:700;font-size:36px;padding:28px 48px;border-radius:999px;display:inline-flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.src{font-size:20px;color:#cfc6b2;text-align:right;max-width:340px;line-height:1.35}
</style></head><body>
<svg class="deco" width="760" height="760" viewBox="-560 -560 1120 1120"><circle cx="0" cy="0" r="60" fill="none" stroke="rgba(212,166,42,0.50)" stroke-width="1.5"/><circle cx="0" cy="0" r="120" fill="none" stroke="rgba(212,166,42,0.45)" stroke-width="1.5"/><circle cx="0" cy="0" r="180" fill="none" stroke="rgba(212,166,42,0.40)" stroke-width="3"/><circle cx="0" cy="0" r="240" fill="none" stroke="rgba(212,166,42,0.35)" stroke-width="1.5"/><circle cx="0" cy="0" r="300" fill="none" stroke="rgba(212,166,42,0.30)" stroke-width="1.5"/><circle cx="0" cy="0" r="360" fill="none" stroke="rgba(212,166,42,0.25)" stroke-width="3"/><circle cx="0" cy="0" r="420" fill="none" stroke="rgba(212,166,42,0.20)" stroke-width="1.5"/><circle cx="0" cy="0" r="480" fill="none" stroke="rgba(212,166,42,0.15)" stroke-width="1.5"/><circle cx="0" cy="0" r="540" fill="none" stroke="rgba(212,166,42,0.10)" stroke-width="3"/><circle cx="0" cy="0" r="22" fill="#d4a62a"/></svg>
<svg class="deco2" width="520" height="520" viewBox="-260 -260 520 520"><circle cx="0" cy="0" r="60" fill="none" stroke="rgba(212,166,42,0.50)" stroke-width="1.5"/><circle cx="0" cy="0" r="120" fill="none" stroke="rgba(212,166,42,0.45)" stroke-width="1.5"/><circle cx="0" cy="0" r="180" fill="none" stroke="rgba(212,166,42,0.40)" stroke-width="3"/><circle cx="0" cy="0" r="240" fill="none" stroke="rgba(212,166,42,0.35)" stroke-width="1.5"/></svg>
<div class="frame">
  <div class="top">
    <div class="logo"><svg width="54" height="54" viewBox="-25 -25 50 50"><circle r="22" fill="none" stroke="#d4a62a" stroke-width="3"/><circle r="14" fill="none" stroke="#d4a62a" stroke-width="2"/><circle r="6" fill="#d4a62a"/></svg><span>Gold<b>Ageing</b></span></div>
    <div class="tag">AgeTech</div>
  </div>
  <div class="main">
    <div class="eyebrow">Tecnologia com propósito</div>
    <h1>Tecnologia que devolve <em>autonomia</em>.</h1><p class="sub">Teleassistência, saúde digital e casas inteligentes para viver com independência e segurança. Escolhemos, financiamos e implementamos consigo.</p>
  </div>
  <div class="bottom">
    <div class="btn">Descubra a AgeTech <span>→</span></div>
    
  </div>
</div></body></html>
